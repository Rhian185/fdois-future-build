name: Publicar site F Dois Engenharia

on:
  push:
    branches:
      - principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Construir site
        run: bun run build

      - name: Verificar arquivos gerados
        run: |
          echo "=== Conteúdo da raiz ==="
          ls -la

          echo "=== Pastas de saída ==="
          if [ -d ".output/public" ]; then
            echo "Encontrado: .output/public"
            ls -la .output/public
          elif [ -d "dist" ]; then
            echo "Encontrado: dist"
            ls -la dist
          else
            echo "ERRO: Nenhuma pasta de saída foi encontrada."
            echo "=== Pastas existentes ==="
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

      - name: Preparar site para GitHub Pages
        run: |
          if [ -d ".output/public" ]; then
            echo "Usando .output/public"
            mkdir -p public-pages
            cp -R .output/public/. public-pages/
          elif [ -d "dist" ]; then
            echo "Usando dist"
            mkdir -p public-pages
            cp -R dist/. public-pages/
          fi

          if [ -f "public-pages/index.html" ]; then
            cp "public-pages/index.html" "public-pages/404.html"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public-pages

  publicar:
    needs: construir
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
